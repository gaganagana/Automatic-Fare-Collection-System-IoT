name: smart_bus_dashboard
description: Smart Bus Automatic Fare Collection & Monitoring System - IoT Fleet Dashboard
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter          # English + Kannada localization support
  cupertino_icons: ^1.0.6
  provider: ^6.1.2          # simple state management for the whole dashboard
  shelf: ^1.4.1              # embedded HTTP server that the ESP32 talks to
  shelf_router: ^1.1.4
  http: ^1.2.2                # used by the recharge flow to notify the ESP32
  intl: ^0.20.2             # date/time + currency formatting, required by l10n codegen
  flutter_tts: ^4.2.0          # text-to-speech announcements (stop names, fare alerts)
  mailer: ^6.1.0              # sends the real "login" email via SMTP
  firebase_core: ^3.6.0       # required bootstrap for any Firebase package
  firebase_auth: ^5.3.1       # real authentication — passwords hashed/managed by Google
  cloud_firestore: ^5.4.4     # stores each user's role (admin/passenger) + linked RFID uid
  google_maps_flutter: ^2.9.0  # real Google Maps for the live bus location view

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1   # generates the real app icon from assets/icon/icon.png
  flutter_native_splash: ^2.4.1     # generates the splash screen shown while the app loads

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0F14"
  adaptive_icon_foreground: "assets/icon/splash_logo.png"

flutter_native_splash:
  color: "#0B0F14"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0B0F14"
    image: assets/icon/splash_logo.png

flutter:
  uses-material-design: true
  generate: true    # runs the l10n codegen (reads l10n.yaml) on every build
  assets:
    - assets/icon/
