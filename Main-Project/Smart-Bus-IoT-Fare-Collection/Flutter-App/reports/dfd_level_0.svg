<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="20" width="960" height="50" rx="8" fill="#1e293b" />
  <text x="500" y="52" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1">DATA FLOW DIAGRAM (DFD) - LEVEL 0 (CONTEXT LEVEL)</text>

  <!-- Central System Bubble -->
  <g filter="url(#shadow)">
    <circle cx="500" cy="350" r="120" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <text x="500" y="325" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">PROCESS 0.0</text>
    <text x="500" y="348" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">Smart Bus Automated</text>
    <text x="500" y="370" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">Ticketing &amp; Transit</text>
    <text x="500" y="392" fill="#94a3b8" font-size="13" text-anchor="middle">Monitoring System</text>
  </g>

  <!-- Entity 1: Passenger (Top Left) -->
  <g filter="url(#shadow)">
    <rect x="60" y="110" width="200" height="90" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5"/>
    <rect x="60" y="110" width="200" height="28" rx="6" fill="#0284c7"/>
    <text x="160" y="129" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">👤 PASSENGER</text>
    <text x="160" y="156" fill="#334155" font-size="11.5" text-anchor="middle">• RFID Smart Card Holder</text>
    <text x="160" y="174" fill="#334155" font-size="11.5" text-anchor="middle">• Mobile App User</text>
  </g>

  <!-- Entity 2: Hardware Controller & IoT (Bottom Left) -->
  <g filter="url(#shadow)">
    <rect x="60" y="510" width="220" height="110" rx="6" fill="#f8fafc" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="60" y="510" width="220" height="28" rx="6" fill="#16a34a"/>
    <text x="170" y="529" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">🚌 BUS HARDWARE / IoT</text>
    <text x="170" y="555" fill="#334155" font-size="11" text-anchor="middle">• Arduino UNO &amp; RC522 RFID</text>
    <text x="170" y="573" fill="#334155" font-size="11" text-anchor="middle">• NodeMCU ESP8266 Wi-Fi</text>
    <text x="170" y="591" fill="#334155" font-size="11" text-anchor="middle">• SG90 Servo &amp; 16x2 LCD &amp; Audio</text>
  </g>

  <!-- Entity 3: Admin / Depot Operator (Top Right) -->
  <g filter="url(#shadow)">
    <rect x="740" y="110" width="200" height="90" rx="6" fill="#f8fafc" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="740" y="110" width="200" height="28" rx="6" fill="#ea580c"/>
    <text x="840" y="129" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">👨‍💼 ADMIN / OPERATOR</text>
    <text x="840" y="156" fill="#334155" font-size="11.5" text-anchor="middle">• Fleet Manager</text>
    <text x="840" y="174" fill="#334155" font-size="11.5" text-anchor="middle">• Card / Wallet Issuer</text>
  </g>

  <!-- Entity 4: Cloud DB & Firebase (Bottom Right) -->
  <g filter="url(#shadow)">
    <rect x="730" y="510" width="220" height="110" rx="6" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2.5"/>
    <rect x="730" y="510" width="220" height="28" rx="6" fill="#8b5cf6"/>
    <text x="840" y="529" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">☁️ CLOUD / PAYMENT GW</text>
    <text x="840" y="555" fill="#334155" font-size="11" text-anchor="middle">• Firebase Cloud Firestore</text>
    <text x="840" y="573" fill="#334155" font-size="11" text-anchor="middle">• Realtime Telemetry Sync</text>
    <text x="840" y="591" fill="#334155" font-size="11" text-anchor="middle">• Razorpay / UPI Gateway</text>
  </g>

  <!-- Data Flows: Passenger <-> System -->
  <!-- 1. Passenger to System: Tap / Queries -->
  <path d="M 260 145 C 330 145, 390 240, 420 280" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="255" y="180" width="165" height="34" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="337" y="195" fill="#0369a1" font-size="10.5" font-weight="bold" text-anchor="middle">RFID Tap / App Login</text>
  <text x="337" y="208" fill="#0369a1" font-size="9.5" text-anchor="middle">AI Query / Recharge Req</text>

  <!-- 2. System to Passenger: Feedback -->
  <path d="M 405 310 C 350 280, 290 220, 245 195" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
  <rect x="230" y="240" width="160" height="34" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="310" y="255" fill="#0369a1" font-size="10.5" font-weight="bold" text-anchor="middle">Gate Open / Voice / LCD</text>
  <text x="310" y="268" fill="#0369a1" font-size="9.5" text-anchor="middle">Live Map &amp; Balance Alert</text>

  <!-- Data Flows: Hardware <-> System -->
  <!-- 3. Hardware to System: Sensor & Telemetry -->
  <path d="M 280 540 C 350 520, 400 460, 430 425" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="260" y="475" width="160" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="340" y="490" fill="#15803d" font-size="10.5" font-weight="bold" text-anchor="middle">RFID Tag UID / GPS Speed</text>
  <text x="340" y="503" fill="#15803d" font-size="9.5" text-anchor="middle">Telemetry Event (Port 8080)</text>

  <!-- 4. System to Hardware: Actuation -->
  <path d="M 410 440 C 360 480, 310 560, 280 575" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>
  <rect x="240" y="535" width="155" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="317" y="550" fill="#15803d" font-size="10.5" font-weight="bold" text-anchor="middle">Servo Gate (0°/90° PWM)</text>
  <text x="317" y="563" fill="#15803d" font-size="9.5" text-anchor="middle">LCD String &amp; MP3 Track</text>

  <!-- Data Flows: Admin <-> System -->
  <!-- 5. Admin to System: Config & Control -->
  <path d="M 740 145 C 670 145, 610 240, 580 280" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="180" width="160" height="34" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="660" y="195" fill="#c2410c" font-size="10.5" font-weight="bold" text-anchor="middle">Card Register / Block Cmd</text>
  <text x="660" y="208" fill="#c2410c" font-size="9.5" text-anchor="middle">Route &amp; IP Config (192.168.x)</text>

  <!-- 6. System to Admin: Reports & Live Logs -->
  <path d="M 595 310 C 650 280, 710 220, 755 195" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="610" y="240" width="160" height="34" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="690" y="255" fill="#c2410c" font-size="10.5" font-weight="bold" text-anchor="middle">Live Passenger Count</text>
  <text x="690" y="268" fill="#c2410c" font-size="9.5" text-anchor="middle">Fare Logs &amp; Audit Trail</text>

  <!-- Data Flows: Cloud & Payment <-> System -->
  <!-- 7. System to Cloud: Sync & Deductions -->
  <path d="M 570 425 C 600 460, 650 520, 730 540" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="475" width="160" height="34" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="660" y="490" fill="#6d28d9" font-size="10.5" font-weight="bold" text-anchor="middle">Save Wallet &amp; Tx Records</text>
  <text x="660" y="503" fill="#6d28d9" font-size="9.5" text-anchor="middle">Push Realtime Telemetry</text>

  <!-- 8. Cloud to System: Wallet Data & Payment Webhook -->
  <path d="M 730 580 C 690 560, 640 480, 590 440" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="605" y="535" width="165" height="34" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="687" y="550" fill="#6d28d9" font-size="10.5" font-weight="bold" text-anchor="middle">Payment Success Webhook</text>
  <text x="687" y="563" fill="#6d28d9" font-size="9.5" text-anchor="middle">Auth &amp; Wallet State Fetch</text>

  <!-- Legend -->
  <rect x="350" y="635" width="300" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <line x1="365" y1="650" x2="395" y2="650" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="405" y="654" fill="#475569" font-size="10.5">Control / Data Input</text>
  <line x1="510" y1="650" x2="540" y2="650" stroke="#1e293b" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="550" y="654" fill="#475569" font-size="10.5">Output / Response</text>
</svg>