<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="40" fill="#0f172a" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="0.5">FULL PROJECT DFD LEVEL 0: CONTEXT DIAGRAM</text>
  <text x="500" y="65" fill="#64748b" font-size="13" text-anchor="middle">Complete Hardware (Arduino + NodeMCU + Sensors) &amp; Software (Flutter + Firebase) Ecosystem</text>
  <line x1="80" y1="80" x2="920" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- CENTRAL SYSTEM 0.0 -->
  <circle cx="500" cy="340" r="120" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  <text x="500" y="300" fill="#0284c7" font-size="16" font-weight="bold" text-anchor="middle">0.0</text>
  <text x="500" y="325" fill="#0f172a" font-size="16" font-weight="bold" text-anchor="middle">Smart Bus Automated</text>
  <text x="500" y="348" fill="#0f172a" font-size="16" font-weight="bold" text-anchor="middle">IoT Transit &amp; Ticketing</text>
  <text x="500" y="370" fill="#0f172a" font-size="16" font-weight="bold" text-anchor="middle">System</text>
  <text x="500" y="392" fill="#475569" font-size="11" text-anchor="middle">(Hardware + Software Integrated)</text>

  <!-- ENTITY 1: PHYSICAL PASSENGER & RFID CARD (LEFT) -->
  <rect x="30" y="270" width="180" height="130" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="30" y="270" width="180" height="30" fill="#0284c7"/>
  <text x="120" y="290" fill="#ffffff" font-size="13.5" font-weight="bold" text-anchor="middle">PASSENGER</text>
  <text x="120" y="322" fill="#334155" font-size="11.5" text-anchor="middle">• Taps RFID Smart Card</text>
  <text x="120" y="342" fill="#334155" font-size="11.5" text-anchor="middle">• Hears Audio &amp; Sees LCD</text>
  <text x="120" y="362" fill="#334155" font-size="11.5" text-anchor="middle">• Passes Servo Door Barrier</text>
  <text x="120" y="382" fill="#334155" font-size="11.5" text-anchor="middle">• Uses Mobile Flutter App</text>

  <!-- ENTITY 2: PHYSICAL HARDWARE PERIPHERALS (BOTTOM) -->
  <rect x="300" y="500" width="400" height="95" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="300" y="500" width="400" height="28" fill="#16a34a"/>
  <text x="500" y="520" fill="#ffffff" font-size="13.5" font-weight="bold" text-anchor="middle">HARDWARE PERIPHERALS &amp; ACTUATORS</text>
  <text x="500" y="548" fill="#334155" font-size="11" text-anchor="middle">• MFRC522 RFID 13.56 MHz Reader • SG90 Micro Servo Gate (0°/90°)</text>
  <text x="500" y="568" fill="#334155" font-size="11" text-anchor="middle">• 16x2 I2C LCD Display (0x27) • DFPlayer Mini MP3 Voice Module &amp; Speaker</text>
  <text x="500" y="585" fill="#334155" font-size="10.5" text-anchor="middle">• Arduino UNO (ATmega328P) &amp; NodeMCU ESP8266 (Wi-Fi 802.11 b/g/n)</text>

  <!-- ENTITY 3: ADMIN / OPERATOR (TOP) -->
  <rect x="370" y="110" width="260" height="85" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="370" y="110" width="260" height="28" fill="#ea580c"/>
  <text x="500" y="129" fill="#ffffff" font-size="13.5" font-weight="bold" text-anchor="middle">ADMIN / DEPOT CONTROLLER</text>
  <text x="500" y="156" fill="#334155" font-size="11.5" text-anchor="middle">• Registers RFID Cards &amp; Manages Balances</text>
  <text x="500" y="174" fill="#334155" font-size="11.5" text-anchor="middle">• Inactivates/Blocks Cards • Configures IP</text>

  <!-- ENTITY 4: CLOUD & PAYMENT GATEWAY (RIGHT) -->
  <rect x="790" y="270" width="180" height="130" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="790" y="270" width="180" height="30" fill="#8b5cf6"/>
  <text x="880" y="290" fill="#ffffff" font-size="13.5" font-weight="bold" text-anchor="middle">CLOUD &amp; PAYMENT</text>
  <text x="880" y="322" fill="#334155" font-size="11.5" text-anchor="middle">• Firebase Cloud Firestore</text>
  <text x="880" y="342" fill="#334155" font-size="11.5" text-anchor="middle">• User Authentication</text>
  <text x="880" y="362" fill="#334155" font-size="11.5" text-anchor="middle">• Razorpay / UPI Gateway</text>
  <text x="880" y="382" fill="#334155" font-size="11.5" text-anchor="middle">• Email Receipt Service</text>

  <!-- DATA FLOW LINES -->
  <!-- Passenger -> System -->
  <line x1="210" y1="315" x2="375" y2="315" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="307" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Physical Card Tap / App Req</text>

  <!-- System -> Passenger -->
  <line x1="380" y1="365" x2="215" y2="365" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="382" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Gate Open / LCD &amp; Audio Voice</text>

  <!-- Admin -> System -->
  <line x1="470" y1="195" x2="470" y2="215" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="210" font-size="10.5" font-weight="bold" fill="#0f172a">Card Registration / Block</text>

  <!-- System -> Admin -->
  <line x1="530" y1="215" x2="530" y2="200" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="210" font-size="10.5" font-weight="bold" fill="#0f172a">Real-time Telemetry &amp; Revenue</text>

  <!-- System -> Hardware Peripherals -->
  <line x1="460" y1="460" x2="460" y2="495" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="355" y="480" font-size="10.5" font-weight="bold" fill="#16a34a">Servo PWM (90°), LCD, MP3 Track</text>

  <!-- Hardware Peripherals -> System -->
  <line x1="540" y1="495" x2="540" y2="465" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="548" y="480" font-size="10.5" font-weight="bold" fill="#16a34a">RC522 UID (SPI) &amp; UART Telemetry</text>

  <!-- System -> Cloud -->
  <line x1="620" y1="315" x2="785" y2="315" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="705" y="307" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Save Fare Audit &amp; Telemetry</text>

  <!-- Cloud -> System -->
  <line x1="790" y1="365" x2="625" y2="365" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="705" y="382" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Payment Success Webhook</text>
</svg>