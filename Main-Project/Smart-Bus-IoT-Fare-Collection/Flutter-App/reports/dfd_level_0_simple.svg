<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" fill="#0f172a" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="0.5">DFD LEVEL 0: CONTEXT DIAGRAM</text>
  <text x="450" y="65" fill="#64748b" font-size="13" text-anchor="middle">Smart Bus Automated RFID Ticketing &amp; Transit System</text>
  <line x1="100" y1="80" x2="800" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- CENTRAL PROCESS 0.0 -->
  <circle cx="450" cy="300" r="105" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  <text x="450" y="275" fill="#0284c7" font-size="15" font-weight="bold" text-anchor="middle">0.0</text>
  <text x="450" y="298" fill="#0f172a" font-size="16" font-weight="bold" text-anchor="middle">Smart Bus Automated</text>
  <text x="450" y="320" fill="#0f172a" font-size="16" font-weight="bold" text-anchor="middle">Ticketing &amp; Fleet</text>
  <text x="450" y="342" fill="#0f172a" font-size="16" font-weight="bold" text-anchor="middle">System</text>

  <!-- ENTITY 1: PASSENGER (LEFT) -->
  <rect x="40" y="240" width="160" height="110" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="40" y="240" width="160" height="30" fill="#0284c7"/>
  <text x="120" y="260" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">PASSENGER</text>
  <text x="120" y="292" fill="#334155" font-size="12" text-anchor="middle">• RFID Card Tap</text>
  <text x="120" y="312" fill="#334155" font-size="12" text-anchor="middle">• Mobile App User</text>
  <text x="120" y="332" fill="#334155" font-size="12" text-anchor="middle">• Recharges Wallet</text>

  <!-- ENTITY 2: BUS HARDWARE (BOTTOM) -->
  <rect x="340" y="450" width="220" height="85" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="340" y="450" width="220" height="26" fill="#16a34a"/>
  <text x="450" y="468" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">BUS HARDWARE / IoT</text>
  <text x="450" y="495" fill="#334155" font-size="11.5" text-anchor="middle">Arduino UNO • RC522 RFID</text>
  <text x="450" y="515" fill="#334155" font-size="11.5" text-anchor="middle">NodeMCU ESP8266 • SG90 Servo</text>

  <!-- ENTITY 3: ADMIN / OPERATOR (TOP) -->
  <rect x="350" y="100" width="200" height="75" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="350" y="100" width="200" height="26" fill="#ea580c"/>
  <text x="450" y="118" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">ADMIN / OPERATOR</text>
  <text x="450" y="145" fill="#334155" font-size="11.5" text-anchor="middle">Card Registration &amp; Blocking</text>
  <text x="450" y="163" fill="#334155" font-size="11.5" text-anchor="middle">Route &amp; Telemetry Reports</text>

  <!-- ENTITY 4: CLOUD & PAYMENT (RIGHT) -->
  <rect x="700" y="240" width="160" height="110" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="700" y="240" width="160" height="30" fill="#8b5cf6"/>
  <text x="780" y="260" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">CLOUD &amp; PAYMENT</text>
  <text x="780" y="292" fill="#334155" font-size="12" text-anchor="middle">• Firebase Cloud DB</text>
  <text x="780" y="312" fill="#334155" font-size="12" text-anchor="middle">• Razorpay / UPI</text>
  <text x="780" y="332" fill="#334155" font-size="12" text-anchor="middle">• Telemetry Sync</text>

  <!-- FLOWS: PASSENGER <-> SYSTEM -->
  <!-- Passenger -> System -->
  <line x1="200" y1="280" x2="340" y2="280" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="272" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">RFID Tap / App Query</text>

  <!-- System -> Passenger -->
  <line x1="340" y1="320" x2="205" y2="320" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="336" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Gate Open / Fare Receipt</text>

  <!-- FLOWS: ADMIN <-> SYSTEM -->
  <!-- Admin -> System -->
  <line x1="430" y1="175" x2="430" y2="190" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="355" y="185" font-size="10.5" font-weight="bold" fill="#0f172a">Card Reg / Block Cmd</text>

  <!-- System -> Admin -->
  <line x1="470" y1="190" x2="470" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="478" y="185" font-size="10.5" font-weight="bold" fill="#0f172a">Live Passenger &amp; Revenue Data</text>

  <!-- FLOWS: HARDWARE <-> SYSTEM -->
  <!-- Hardware -> System -->
  <line x1="430" y1="450" x2="430" y2="410" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="430" font-size="10.5" font-weight="bold" fill="#0f172a">Raw Card UID / Speed</text>

  <!-- System -> Hardware -->
  <line x1="470" y1="410" x2="470" y2="445" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="478" y="430" font-size="10.5" font-weight="bold" fill="#0f172a">Servo Angle, LCD &amp; Audio</text>

  <!-- FLOWS: CLOUD <-> SYSTEM -->
  <!-- System -> Cloud -->
  <line x1="555" y1="280" x2="695" y2="280" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="625" y="272" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Save Fare &amp; Tx Logs</text>

  <!-- Cloud -> System -->
  <line x1="700" y1="320" x2="560" y2="320" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="625" y="336" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Payment Success / Sync</text>
</svg>