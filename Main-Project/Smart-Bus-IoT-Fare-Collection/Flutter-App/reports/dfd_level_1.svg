<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="1150" height="820" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="20" y="15" width="1110" height="45" rx="6" fill="#0f172a"/>
  <text x="575" y="44" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="1">DATA FLOW DIAGRAM (DFD) - LEVEL 1 (FUNCTIONAL DECOMPOSITION)</text>

  <!-- EXTERNAL ENTITIES (LEFT & RIGHT) -->
  <!-- Entity: Passenger -->
  <g filter="url(#shadow1)">
    <rect x="30" y="80" width="150" height="70" rx="5" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="80" width="150" height="22" rx="5" fill="#0284c7"/>
    <text x="105" y="96" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">👤 PASSENGER</text>
    <text x="105" y="125" fill="#334155" font-size="10.5" text-anchor="middle">Card Tap &amp; Mobile App</text>
  </g>

  <!-- Entity: Hardware / Sensors -->
  <g filter="url(#shadow1)">
    <rect x="30" y="380" width="150" height="85" rx="5" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
    <rect x="30" y="380" width="150" height="22" rx="5" fill="#16a34a"/>
    <text x="105" y="396" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">🚌 BUS HARDWARE</text>
    <text x="105" y="423" fill="#334155" font-size="10" text-anchor="middle">RC522 RFID &amp; Arduino</text>
    <text x="105" y="443" fill="#334155" font-size="10" text-anchor="middle">NodeMCU &amp; Servo &amp; LCD</text>
  </g>

  <!-- Entity: Admin -->
  <g filter="url(#shadow1)">
    <rect x="970" y="80" width="150" height="70" rx="5" fill="#f8fafc" stroke="#ea580c" stroke-width="2"/>
    <rect x="970" y="80" width="150" height="22" rx="5" fill="#ea580c"/>
    <text x="1045" y="96" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">👨‍💼 ADMIN</text>
    <text x="1045" y="125" fill="#334155" font-size="10.5" text-anchor="middle">Operator Dashboard</text>
  </g>

  <!-- Entity: Payment Gateway -->
  <g filter="url(#shadow1)">
    <rect x="970" y="690" width="150" height="70" rx="5" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="970" y="690" width="150" height="22" rx="5" fill="#8b5cf6"/>
    <text x="1045" y="706" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">💳 PAYMENT GW</text>
    <text x="1045" y="735" fill="#334155" font-size="10.5" text-anchor="middle">Razorpay / UPI</text>
  </g>

  <!-- PROCESSES (CIRCULAR / ROUNDED RECTANGLES) -->

  <!-- Process 1.0: RFID Authentication & Card Validation -->
  <g filter="url(#shadow1)">
    <rect x="250" y="80" width="200" height="75" rx="20" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <text x="350" y="105" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1.0 RFID Card Read &amp;</text>
    <text x="350" y="125" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Authentication</text>
    <text x="350" y="142" fill="#e0f2fe" font-size="9.5" text-anchor="middle">Check Active &amp; Min ₹10</text>
  </g>

  <!-- Process 2.0: Automated Journey & Fare Engine -->
  <g filter="url(#shadow1)">
    <rect x="580" y="80" width="220" height="85" rx="20" fill="#0f766e" stroke="#115e59" stroke-width="2"/>
    <text x="690" y="105" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2.0 Journey Tracking &amp;</text>
    <text x="690" y="125" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Fare Calculation</text>
    <text x="690" y="143" fill="#ccfbf1" font-size="9.5" text-anchor="middle">Entry/Exit &amp; ₹10/Stop Math</text>
  </g>

  <!-- Process 3.0: Hardware Actuation & Feedback -->
  <g filter="url(#shadow1)">
    <rect x="250" y="380" width="200" height="85" rx="20" fill="#15803d" stroke="#166534" stroke-width="2"/>
    <text x="350" y="405" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">3.0 Gate Actuation &amp;</text>
    <text x="350" y="425" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Audio-Visual Feedback</text>
    <text x="350" y="445" fill="#dcfce7" font-size="9.5" text-anchor="middle">Servo 90°, 16x2 LCD, DFPlayer</text>
  </g>

  <!-- Process 4.0: IoT Cloud Telemetry & NodeMCU Sync -->
  <g filter="url(#shadow1)">
    <rect x="580" y="380" width="220" height="85" rx="20" fill="#4338ca" stroke="#3730a3" stroke-width="2"/>
    <text x="690" y="405" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">4.0 IoT Cloud Telemetry</text>
    <text x="690" y="425" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">&amp; State Sync</text>
    <text x="690" y="445" fill="#e0e7ff" font-size="9.5" text-anchor="middle">NodeMCU HTTP :8080 &amp; Firebase</text>
  </g>

  <!-- Process 5.0: Passenger Mobile App & Conversational AI -->
  <g filter="url(#shadow1)">
    <rect x="240" y="680" width="220" height="85" rx="20" fill="#0369a1" stroke="#075985" stroke-width="2"/>
    <text x="350" y="705" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">5.0 Passenger App &amp;</text>
    <text x="350" y="725" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">AI Transit Assistant</text>
    <text x="350" y="745" fill="#e0f2fe" font-size="9.5" text-anchor="middle">Live Map, Routes, Offline AI Bot</text>
  </g>

  <!-- Process 6.0: Admin Management & Wallet Billing -->
  <g filter="url(#shadow1)">
    <rect x="580" y="680" width="220" height="85" rx="20" fill="#b45309" stroke="#92400e" stroke-width="2"/>
    <text x="690" y="705" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">6.0 Admin Management</text>
    <text x="690" y="725" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">&amp; Wallet Top-up</text>
    <text x="690" y="745" fill="#fef3c7" font-size="9.5" text-anchor="middle">Card Issuer, Block, Razorpay</text>
  </g>

  <!-- DATA STORES (OPEN-ENDED RECTANGLES) -->
  <!-- D1: RFID Wallet DB (Center Left) -->
  <g>
    <line x1="300" y1="260" x2="480" y2="260" stroke="#0284c7" stroke-width="3"/>
    <line x1="300" y1="310" x2="480" y2="310" stroke="#0284c7" stroke-width="3"/>
    <rect x="300" y="260" width="180" height="50" fill="#f0f9ff"/>
    <text x="320" y="282" fill="#0369a1" font-size="12" font-weight="bold">D1</text>
    <text x="350" y="282" fill="#0f172a" font-size="12" font-weight="bold">RFID Wallet DB</text>
    <text x="350" y="298" fill="#475569" font-size="10">UID, Balance, Active, Entry</text>
  </g>

  <!-- D2: Stops & Route DB (Center Top) -->
  <g>
    <line x1="590" y1="260" x2="770" y2="260" stroke="#0f766e" stroke-width="3"/>
    <line x1="590" y1="310" x2="770" y2="310" stroke="#0f766e" stroke-width="3"/>
    <rect x="590" y="260" width="180" height="50" fill="#f0fdfa"/>
    <text x="610" y="282" fill="#115e59" font-size="12" font-weight="bold">D2</text>
    <text x="640" y="282" fill="#0f172a" font-size="12" font-weight="bold">Route 25A Stops DB</text>
    <text x="640" y="298" fill="#475569" font-size="10">18 Stops, Fares, Audio MP3</text>
  </g>

  <!-- D3: Transactions DB (Center Bottom) -->
  <g>
    <line x1="590" y1="560" x2="770" y2="560" stroke="#b45309" stroke-width="3"/>
    <line x1="590" y1="610" x2="770" y2="610" stroke="#b45309" stroke-width="3"/>
    <rect x="590" y="560" width="180" height="50" fill="#fffbeb"/>
    <text x="610" y="582" fill="#92400e" font-size="12" font-weight="bold">D3</text>
    <text x="640" y="582" fill="#0f172a" font-size="12" font-weight="bold">Transaction Logs DB</text>
    <text x="640" y="598" fill="#475569" font-size="10">Audit Records, Deductions</text>
  </g>

  <!-- D4: Live Telemetry State (Bottom Center) -->
  <g>
    <line x1="300" y1="560" x2="480" y2="560" stroke="#4338ca" stroke-width="3"/>
    <line x1="300" y1="610" x2="480" y2="610" stroke="#4338ca" stroke-width="3"/>
    <rect x="300" y="560" width="180" height="50" fill="#eef2ff"/>
    <text x="320" y="582" fill="#3730a3" font-size="12" font-weight="bold">D4</text>
    <text x="350" y="582" fill="#0f172a" font-size="12" font-weight="bold">Live Telemetry State</text>
    <text x="350" y="598" fill="#475569" font-size="10">Stop Index, Speed, NodeMCU IP</text>
  </g>

  <!-- FLOW CONNECTORS -->
  <!-- Passenger -> 1.0 -->
  <line x1="180" y1="115" x2="245" y2="115" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="212" y="108" font-size="9" fill="#334155" text-anchor="middle">Tap Card</text>

  <!-- Hardware -> 1.0 -->
  <path d="M 105 380 L 105 130 L 245 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="140" y="145" font-size="9" fill="#334155">Card UID (SPI)</text>

  <!-- 1.0 <-> D1 -->
  <line x1="350" y1="155" x2="350" y2="255" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="355" y="210" font-size="9" fill="#0284c7">Validate UID &amp; Bal</text>

  <!-- 1.0 -> 2.0 -->
  <line x1="450" y1="115" x2="575" y2="115" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="515" y="108" font-size="9" fill="#334155" text-anchor="middle">Auth Card Data</text>

  <!-- 2.0 <-> D2 (Stops DB) -->
  <line x1="690" y1="165" x2="690" y2="255" stroke="#0f766e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="695" y="215" font-size="9" fill="#0f766e">Fetch Stop IDs &amp; Indices</text>

  <!-- 2.0 -> D3 (Transaction Logs) -->
  <path d="M 780 165 C 830 250, 830 500, 775 570" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="835" y="370" font-size="9" fill="#b45309">Write Fare Deduction</text>

  <!-- 2.0 -> 3.0 (Gate Actuation) -->
  <path d="M 640 165 C 500 240, 480 320, 440 375" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arr)"/>
  <text x="520" y="300" font-size="9" fill="#15803d" font-weight="bold">Gate Trigger (Valid/Denied)</text>

  <!-- 3.0 -> Hardware -->
  <line x1="250" y1="422" x2="185" y2="422" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="217" y="415" font-size="9" fill="#16a34a" text-anchor="middle">Servo/LCD/MP3</text>

  <!-- 2.0 -> 4.0 (Telemetry Sync) -->
  <line x1="690" y1="165" x2="690" y2="375" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <text x="695" y="340" font-size="9" fill="#4338ca">Live Event Packet</text>

  <!-- 4.0 <-> D4 -->
  <line x1="580" y1="440" x2="485" y2="570" stroke="#4338ca" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="510" y="500" font-size="9" fill="#4338ca">Update Bus Speed &amp; Stop</text>

  <!-- 4.0 -> 5.0 (App Live Map) -->
  <path d="M 640 465 C 560 550, 460 620, 390 675" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="490" y="600" font-size="9" fill="#0369a1">Broadcast Event Stream</text>

  <!-- Passenger <-> 5.0 -->
  <path d="M 80 150 C 60 300, 60 600, 235 700" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="75" y="550" font-size="9" fill="#0284c7">App Views / AI Chat</text>

  <!-- Admin <-> 6.0 -->
  <path d="M 1045 150 C 1045 350, 1000 600, 805 700" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="960" y="450" font-size="9" fill="#ea580c">Card Management &amp; Top-up</text>

  <!-- 6.0 <-> D1 (Update Wallets) -->
  <path d="M 580 720 C 490 700, 470 450, 420 315" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="475" y="480" font-size="9" fill="#0284c7">Recharge &amp; Block Card</text>

  <!-- 6.0 <-> Payment GW -->
  <line x1="800" y1="725" x2="965" y2="725" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="880" y="718" font-size="9" fill="#8b5cf6" text-anchor="middle">Online PG Order / Webhook</text>
</svg>