<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 920" width="1150" height="920" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="575" y="35" fill="#0f172a" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="0.5">FULL PROJECT DFD LEVEL 1: HARDWARE &amp; SOFTWARE INTEGRATED FLOW</text>
  <text x="575" y="58" fill="#64748b" font-size="12" text-anchor="middle">Sequential Data Flow: Physical RFID ➔ Arduino UNO ➔ NodeMCU Wi-Fi ➔ Flutter App ➔ Firebase Cloud</text>
  <line x1="40" y1="70" x2="1110" y2="70" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- PHYSICAL ENTITY: PASSENGER -->
  <rect x="30" y="90" width="140" height="70" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="100" y="115" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">PASSENGER</text>
  <text x="100" y="135" fill="#475569" font-size="10.5" text-anchor="middle">Taps RFID Card</text>
  <text x="100" y="150" fill="#475569" font-size="9.5" text-anchor="middle">(13.56 MHz Card)</text>

  <!-- PHYSICAL ACTUATORS ENTITY -->
  <rect x="30" y="370" width="150" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="105" y="395" fill="#16a34a" font-size="12" font-weight="bold" text-anchor="middle">HARDWARE ACTUATORS</text>
  <text x="105" y="415" fill="#475569" font-size="10" text-anchor="middle">• SG90 Servo Gate (PWM)</text>
  <text x="105" y="433" fill="#475569" font-size="10" text-anchor="middle">• 16x2 I2C LCD (0x27)</text>
  <text x="105" y="450" fill="#475569" font-size="10" text-anchor="middle">• DFPlayer Mini MP3 Voice</text>

  <!-- ENTITY: ADMIN & USER APP -->
  <rect x="970" y="770" width="150" height="70" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="1045" y="795" fill="#ea580c" font-size="12" font-weight="bold" text-anchor="middle">ADMIN &amp; PASSENGER</text>
  <text x="1045" y="815" fill="#475569" font-size="10" text-anchor="middle">Flutter Dashboard</text>
  <text x="1045" y="830" fill="#475569" font-size="10" text-anchor="middle">AI Chat &amp; Recharges</text>

  <!-- DATA STORES -->
  <!-- D1: RFID Wallet DB -->
  <g>
    <line x1="560" y1="100" x2="760" y2="100" stroke="#0284c7" stroke-width="2.5"/>
    <line x1="560" y1="150" x2="760" y2="150" stroke="#0284c7" stroke-width="2.5"/>
    <rect x="560" y="100" width="200" height="50" fill="#f0f9ff"/>
    <text x="580" y="125" fill="#0284c7" font-size="12" font-weight="bold">D1</text>
    <text x="610" y="125" fill="#0f172a" font-size="11.5" font-weight="bold">RFID Wallet DB</text>
    <text x="610" y="140" fill="#475569" font-size="9.5">UID, Balance, Active, EntryStop</text>
  </g>

  <!-- D2: 18-Stop Route Database -->
  <g>
    <line x1="560" y1="440" x2="760" y2="440" stroke="#0f766e" stroke-width="2.5"/>
    <line x1="560" y1="490" x2="760" y2="490" stroke="#0f766e" stroke-width="2.5"/>
    <rect x="560" y="440" width="200" height="50" fill="#f0fdfa"/>
    <text x="580" y="465" fill="#0f766e" font-size="12" font-weight="bold">D2</text>
    <text x="610" y="465" fill="#0f172a" font-size="11.5" font-weight="bold">18-Stop Route DB</text>
    <text x="610" y="480" fill="#475569" font-size="9.5">Stop IDs, Index, Coordinates, MP3</text>
  </g>

  <!-- D3: Transaction Logs & Cloud DB -->
  <g>
    <line x1="560" y1="770" x2="760" y2="770" stroke="#b45309" stroke-width="2.5"/>
    <line x1="560" y1="820" x2="760" y2="820" stroke="#b45309" stroke-width="2.5"/>
    <rect x="560" y="770" width="200" height="50" fill="#fffbeb"/>
    <text x="580" y="795" fill="#b45309" font-size="12" font-weight="bold">D3</text>
    <text x="610" y="795" fill="#0f172a" font-size="11.5" font-weight="bold">Transaction &amp; Cloud DB</text>
    <text x="610" y="810" fill="#475569" font-size="9.5">Firebase Audit Logs &amp; Deductions</text>
  </g>

  <!-- PROCESSES (HARDWARE + IOT + SOFTWARE SEQUENCE) -->

  <!-- Process 1.0: Physical RFID Scan (RC522 + Arduino) -->
  <circle cx="310" cy="125" r="55" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="310" y="112" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">1.0</text>
  <text x="310" y="128" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">RFID Scan</text>
  <text x="310" y="142" font-size="9.5" fill="#475569" text-anchor="middle">(RC522 SPI ➔ Arduino)</text>

  <!-- Process 2.0: Serial Data Dispatch (Arduino ➔ NodeMCU) -->
  <circle cx="310" cy="280" r="55" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="310" y="267" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">2.0</text>
  <text x="310" y="283" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">UART Serial Bridge</text>
  <text x="310" y="297" font-size="9.5" fill="#475569" text-anchor="middle">(Arduino ➔ NodeMCU)</text>

  <!-- Process 3.0: Wi-Fi Telemetry Server (NodeMCU HTTP :8080) -->
  <circle cx="310" cy="450" r="55" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="310" y="437" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">3.0</text>
  <text x="310" y="453" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Wi-Fi IoT Gateway</text>
  <text x="310" y="467" font-size="9" fill="#475569" text-anchor="middle">(NodeMCU ESP8266)</text>

  <!-- Process 4.0: Business Logic & Fare Engine (Flutter App) -->
  <circle cx="310" cy="620" r="55" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="310" y="607" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">4.0</text>
  <text x="310" y="623" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Fare Engine</text>
  <text x="310" y="637" font-size="9" fill="#15803d" font-weight="bold" text-anchor="middle">(₹10 / Stop Math)</text>

  <!-- Process 5.0: Actuation Control Dispatch (NodeMCU ➔ Arduino Actuators) -->
  <circle cx="310" cy="790" r="55" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="310" y="777" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">5.0</text>
  <text x="310" y="793" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Actuation Controller</text>
  <text x="310" y="807" font-size="9" fill="#475569" text-anchor="middle">(Servo, LCD, Audio)</text>

  <!-- Process 6.0: Cloud Sync & App UI (Firebase / AI) -->
  <circle cx="900" cy="620" r="55" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="900" y="607" font-size="12" font-weight="bold" fill="#ea580c" text-anchor="middle">6.0</text>
  <text x="900" y="623" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Cloud &amp; UI Sync</text>
  <text x="900" y="637" font-size="9" fill="#475569" text-anchor="middle">(Firebase &amp; Live Map)</text>

  <!-- CONNECTING DATA FLOWS -->
  <!-- Step 1: Passenger -> 1.0 -->
  <line x1="170" y1="125" x2="250" y2="125" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="210" y="117" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Physical Tap</text>

  <!-- Step 2: 1.0 -> 2.0 -->
  <line x1="310" y1="180" x2="310" y2="220" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="205" font-size="9.5" font-weight="bold" fill="#0f172a">Card UID (HEX)</text>

  <!-- Step 3: 2.0 -> 3.0 -->
  <line x1="310" y1="335" x2="310" y2="390" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="365" font-size="9.5" font-weight="bold" fill="#0f172a">UART Packet</text>

  <!-- Step 4: 3.0 -> 4.0 -->
  <line x1="310" y1="505" x2="310" y2="560" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="535" font-size="9.5" font-weight="bold" fill="#0f172a">HTTP REST JSON (Port 8080)</text>

  <!-- 4.0 <-> D1 (Wallet DB) -->
  <path d="M 365 600 C 460 550, 520 250, 570 155" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="490" y="320" font-size="9.5" fill="#0284c7">Validate UID &amp; Debit Bal</text>

  <!-- 4.0 <-> D2 (Stops DB) -->
  <line x1="365" y1="620" x2="555" y2="480" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="470" y="530" font-size="9.5" fill="#0f766e">Lookup 18 Stop Indices</text>

  <!-- 4.0 -> D3 (Transaction DB) -->
  <line x1="365" y1="645" x2="555" y2="780" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="460" y="730" font-size="9.5" fill="#b45309">Store Audit Tx Record</text>

  <!-- Step 5: 4.0 -> 5.0 (Actuation Command) -->
  <line x1="310" y1="675" x2="310" y2="730" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="705" font-size="9.5" font-weight="bold" fill="#16a34a">Actuation Command</text>

  <!-- 5.0 -> Hardware Actuators -->
  <path d="M 255 790 C 140 790, 80 600, 80 465" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="135" y="650" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="middle">Servo 90°, LCD Text, MP3 Voice</text>

  <!-- Step 6: 4.0 -> 6.0 (Cloud & UI Sync) -->
  <line x1="365" y1="620" x2="840" y2="620" stroke="#ea580c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="612" font-size="10" font-weight="bold" fill="#ea580c" text-anchor="middle">Push Live Telemetry &amp; Balance Event</text>

  <!-- 6.0 <-> D3 -->
  <line x1="900" y1="675" x2="765" y2="780" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="850" y="740" font-size="9" fill="#b45309">Sync Cloud Firestore</text>

  <!-- 6.0 -> Admin & Passenger App -->
  <line x1="900" y1="675" x2="975" y2="770" stroke="#ea580c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="965" y="720" font-size="9.5" fill="#ea580c">Live Map &amp; Receipts</text>
</svg>