<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="35" fill="#0f172a" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="0.5">DFD LEVEL 1: END-TO-END FUNCTIONAL FLOW</text>
  <text x="500" y="58" fill="#64748b" font-size="12" text-anchor="middle">Sequential Step-by-Step Data Flow from Boarding to Exit &amp; Cloud Sync</text>
  <line x1="50" y1="70" x2="950" y2="70" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ENTITIES -->
  <!-- 1. Passenger -->
  <rect x="30" y="100" width="130" height="60" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="95" y="125" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">PASSENGER</text>
  <text x="95" y="145" fill="#475569" font-size="10.5" text-anchor="middle">Tap Smart Card</text>

  <!-- 2. Hardware Actuators -->
  <rect x="30" y="380" width="130" height="70" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="95" y="405" fill="#16a34a" font-size="12" font-weight="bold" text-anchor="middle">HARDWARE</text>
  <text x="95" y="423" fill="#475569" font-size="10" text-anchor="middle">Servo Motor (Gate)</text>
  <text x="95" y="440" fill="#475569" font-size="10" text-anchor="middle">LCD &amp; DFPlayer</text>

  <!-- 3. Admin / Mobile App -->
  <rect x="840" y="650" width="130" height="60" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="905" y="675" fill="#ea580c" font-size="11.5" font-weight="bold" text-anchor="middle">ADMIN / APP</text>
  <text x="905" y="695" fill="#475569" font-size="10" text-anchor="middle">Live Map &amp; Billing</text>

  <!-- DATA STORES -->
  <!-- D1: RFID Wallet DB -->
  <g>
    <line x1="500" y1="105" x2="680" y2="105" stroke="#0284c7" stroke-width="2.5"/>
    <line x1="500" y1="155" x2="680" y2="155" stroke="#0284c7" stroke-width="2.5"/>
    <rect x="500" y="105" width="180" height="50" fill="#f0f9ff"/>
    <text x="520" y="130" fill="#0284c7" font-size="12" font-weight="bold">D1</text>
    <text x="545" y="130" fill="#0f172a" font-size="11.5" font-weight="bold">RFID Wallet DB</text>
    <text x="545" y="145" fill="#475569" font-size="9.5">UID, Balance, Active, Entry</text>
  </g>

  <!-- D2: Stops DB -->
  <g>
    <line x1="500" y1="365" x2="680" y2="365" stroke="#0f766e" stroke-width="2.5"/>
    <line x1="500" y1="415" x2="680" y2="415" stroke="#0f766e" stroke-width="2.5"/>
    <rect x="500" y="365" width="180" height="50" fill="#f0fdfa"/>
    <text x="520" y="390" fill="#0f766e" font-size="12" font-weight="bold">D2</text>
    <text x="545" y="390" fill="#0f172a" font-size="11.5" font-weight="bold">Route 25A Stops DB</text>
    <text x="545" y="405" fill="#475569" font-size="9.5">18 Fixed Stops &amp; Fares</text>
  </g>

  <!-- D3: Transaction Logs DB -->
  <g>
    <line x1="500" y1="625" x2="680" y2="625" stroke="#b45309" stroke-width="2.5"/>
    <line x1="500" y1="675" x2="680" y2="675" stroke="#b45309" stroke-width="2.5"/>
    <rect x="500" y="625" width="180" height="50" fill="#fffbeb"/>
    <text x="520" y="650" fill="#b45309" font-size="12" font-weight="bold">D3</text>
    <text x="545" y="650" fill="#0f172a" font-size="11.5" font-weight="bold">Transaction Audit DB</text>
    <text x="545" y="665" fill="#475569" font-size="9.5">Tx Logs &amp; Cloud Telemetry</text>
  </g>

  <!-- PROCESSES (CIRCULAR / OVALS) -->

  <!-- Process 1.0: Scan RFID -->
  <circle cx="270" cy="130" r="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="270" y="122" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">1.0</text>
  <text x="270" y="137" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Scan &amp; Read</text>
  <text x="270" y="150" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">RFID UID</text>

  <!-- Process 2.0: Validate Card -->
  <circle cx="270" cy="260" r="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="270" y="252" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">2.0</text>
  <text x="270" y="267" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Validate Card</text>
  <text x="270" y="280" font-size="9.5" fill="#475569" text-anchor="middle">(Active &amp; &gt;= ₹10)</text>

  <!-- Process 3.0: Boarding (Entry Tap) -->
  <circle cx="270" cy="390" r="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="270" y="382" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">3.0</text>
  <text x="270" y="397" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Boarding &amp;</text>
  <text x="270" y="410" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Gate Open</text>

  <!-- Process 4.0: Exit & Fare Calculation -->
  <circle cx="270" cy="530" r="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="270" y="520" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">4.0</text>
  <text x="270" y="535" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Calculate Fare</text>
  <text x="270" y="548" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">&amp; Debit Wallet</text>

  <!-- Process 5.0: Telemetry & Cloud Sync -->
  <circle cx="270" cy="670" r="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="270" y="660" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">5.0</text>
  <text x="270" y="675" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Cloud Sync</text>
  <text x="270" y="688" font-size="9.5" fill="#475569" text-anchor="middle">&amp; Notifications</text>

  <!-- Process 6.0: Admin & Recharge -->
  <circle cx="800" cy="500" r="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="800" y="490" font-size="12" font-weight="bold" fill="#ea580c" text-anchor="middle">6.0</text>
  <text x="800" y="505" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Recharge &amp;</text>
  <text x="800" y="518" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Card Control</text>

  <!-- FLOW LINES (STEP BY STEP) -->
  <!-- Step 1: Passenger to 1.0 -->
  <line x1="160" y1="130" x2="215" y2="130" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="187" y="122" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Card Tap</text>

  <!-- Step 2: 1.0 to 2.0 -->
  <line x1="270" y1="180" x2="270" y2="205" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="280" y="197" font-size="9.5" font-weight="bold" fill="#0f172a">Card UID</text>

  <!-- 2.0 <-> D1 -->
  <line x1="320" y1="250" x2="495" y2="150" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="435" y="195" font-size="9.5" fill="#0284c7">Check Status &amp; Balance</text>

  <!-- Step 3: 2.0 to 3.0 (If Entry) -->
  <line x1="270" y1="310" x2="270" y2="335" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="280" y="327" font-size="9" font-weight="bold" fill="#16a34a">[If Entry Tap]</text>

  <!-- 3.0 -> Hardware (Open Gate) -->
  <line x1="220" y1="400" x2="165" y2="400" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="190" y="392" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">Servo 90°</text>

  <!-- 3.0 -> D1 (Set Entry Stop) -->
  <path d="M 320 380 C 420 350, 480 220, 520 160" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="440" y="270" font-size="9" fill="#0284c7">Save S_entry</text>

  <!-- Step 4: 2.0 to 4.0 (If Exit) -->
  <path d="M 220 270 C 180 300, 180 480, 220 520" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="145" y="350" font-size="9" font-weight="bold" fill="#0284c7">[If Exit Tap]</text>

  <!-- 4.0 <-> D2 (Get stops) -->
  <line x1="320" y1="520" x2="495" y2="415" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="430" y="475" font-size="9" fill="#0f766e">Lookup Stops</text>

  <!-- 4.0 -> D1 (Debit balance) -->
  <path d="M 320 540 C 470 560, 560 300, 580 160" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="495" y="240" font-size="9" fill="#0284c7">Debit Fare (N*₹10)</text>

  <!-- 4.0 -> Hardware (Exit Gate Open) -->
  <line x1="220" y1="540" x2="165" y2="445" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="175" y="500" font-size="8.5" fill="#16a34a">Open Gate</text>

  <!-- Step 5: 4.0 to 5.0 (Audit & Sync) -->
  <line x1="270" y1="580" x2="270" y2="615" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="280" y="602" font-size="9" font-weight="bold" fill="#0f172a">Tx Record</text>

  <!-- 5.0 -> D3 (Write Log) -->
  <line x1="320" y1="670" x2="495" y2="655" stroke="#b45309" stroke-width="2" marker-end="url(#arr)"/>
  <text x="410" y="655" font-size="9.5" font-weight="bold" fill="#b45309" text-anchor="middle">Write Fare Audit Log</text>

  <!-- 5.0 -> Admin / Mobile App -->
  <path d="M 320 685 C 450 720, 700 720, 835 685" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="580" y="725" font-size="10" font-weight="bold" fill="#ea580c" text-anchor="middle">Live App Update &amp; SMS/Email Receipt</text>

  <!-- Step 6: Admin / Recharge Flow -->
  <line x1="870" y1="645" x2="830" y2="550" stroke="#ea580c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="875" y="595" font-size="9.5" fill="#ea580c">Top-up Req</text>

  <path d="M 800 450 C 800 300, 750 160, 685 135" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="770" y="280" font-size="9.5" fill="#0284c7">Add Balance</text>
</svg>