<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 700" width="1050" height="700" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="525" y="35" fill="#0f172a" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="0.5">FULL PROJECT DFD LEVEL 2: HARDWARE ➔ SOFTWARE TICKETING ENGINE</text>
  <text x="525" y="58" fill="#64748b" font-size="12" text-anchor="middle">Detailed Physical-to-Cloud Data Flow for Boarding, Exit Fare Calculation &amp; Actuation</text>
  <line x1="40" y1="70" x2="1010" y2="70" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- HARDWARE INPUT: RC522 TAP -->
  <rect x="30" y="100" width="160" height="55" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <text x="110" y="123" fill="#0284c7" font-size="11.5" font-weight="bold" text-anchor="middle">PHYSICAL RFID TAP</text>
  <text x="110" y="142" fill="#334155" font-size="10" text-anchor="middle">MFRC522 ➔ Arduino UNO</text>

  <!-- SUB-PROCESS 4.1: UART -> HTTP Translation -->
  <circle cx="300" cy="127" r="45" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="300" y="120" font-size="11.5" font-weight="bold" fill="#0284c7" text-anchor="middle">4.1</text>
  <text x="300" y="135" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Serial to HTTP</text>
  <text x="300" y="148" font-size="8.5" fill="#475569" text-anchor="middle">NodeMCU :8080</text>

  <!-- SUB-PROCESS 4.2: Mode & Balance Validation -->
  <circle cx="520" cy="127" r="45" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="520" y="120" font-size="11.5" font-weight="bold" fill="#0284c7" text-anchor="middle">4.2</text>
  <text x="520" y="135" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Validate Card</text>
  <text x="520" y="148" font-size="8.5" fill="#475569" text-anchor="middle">Active &amp; &gt;= ₹10</text>

  <!-- SUB-PROCESS 4.3: Entry Boarding Tagging -->
  <circle cx="750" cy="127" r="45" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="750" y="120" font-size="11.5" font-weight="bold" fill="#16a34a" text-anchor="middle">4.3</text>
  <text x="750" y="135" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Boarding Tag</text>
  <text x="750" y="148" font-size="8.5" fill="#475569" text-anchor="middle">Set S_entry</text>

  <!-- SUB-PROCESS 4.4: Exit Stop Lookup & Distance Calculation -->
  <circle cx="520" cy="320" r="45" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="520" y="313" font-size="11.5" font-weight="bold" fill="#0284c7" text-anchor="middle">4.4</text>
  <text x="520" y="328" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Compute Stops</text>
  <text x="520" y="341" font-size="8.5" fill="#475569" text-anchor="middle">N = |Exit - Entry|</text>

  <!-- SUB-PROCESS 4.5: Fare Debit & Audit Creation -->
  <circle cx="520" cy="510" r="45" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="520" y="503" font-size="11.5" font-weight="bold" fill="#0284c7" text-anchor="middle">4.5</text>
  <text x="520" y="518" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Debit Balance</text>
  <text x="520" y="531" font-size="8.5" fill="#15803d" font-weight="bold" text-anchor="middle">Fare = N × ₹10</text>

  <!-- SUB-PROCESS 4.6: Return Feedback to Hardware -->
  <circle cx="250" cy="510" r="45" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="250" y="503" font-size="11.5" font-weight="bold" fill="#16a34a" text-anchor="middle">4.6</text>
  <text x="250" y="518" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Actuate Door</text>
  <text x="250" y="531" font-size="8.5" fill="#475569" text-anchor="middle">Servo 90° &amp; Audio</text>

  <!-- DATA STORES -->
  <!-- D1: Wallet DB -->
  <g>
    <line x1="880" y1="105" x2="1010" y2="105" stroke="#0284c7" stroke-width="2"/>
    <line x1="880" y1="150" x2="1010" y2="150" stroke="#0284c7" stroke-width="2"/>
    <rect x="880" y="105" width="130" height="45" fill="#f0f9ff"/>
    <text x="895" y="130" fill="#0284c7" font-size="11" font-weight="bold">D1: Wallet DB</text>
  </g>

  <!-- D2: Stops DB -->
  <g>
    <line x1="750" y1="295" x2="890" y2="295" stroke="#0f766e" stroke-width="2"/>
    <line x1="750" y1="340" x2="890" y2="340" stroke="#0f766e" stroke-width="2"/>
    <rect x="750" y="295" width="140" height="45" fill="#f0fdfa"/>
    <text x="765" y="322" fill="#0f766e" font-size="11" font-weight="bold">D2: 18 Stops DB</text>
  </g>

  <!-- D3: Transaction Logs DB -->
  <g>
    <line x1="750" y1="490" x2="900" y2="490" stroke="#b45309" stroke-width="2"/>
    <line x1="750" y1="535" x2="900" y2="535" stroke="#b45309" stroke-width="2"/>
    <rect x="750" y="490" width="150" height="45" fill="#fffbeb"/>
    <text x="765" y="517" fill="#b45309" font-size="11" font-weight="bold">D3: Transaction DB</text>
  </g>

  <!-- HARDWARE OUTPUT -->
  <rect x="30" y="485" width="150" height="55" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="105" y="508" fill="#16a34a" font-size="11" font-weight="bold" text-anchor="middle">HARDWARE OUTPUT</text>
  <text x="105" y="525" fill="#15803d" font-size="9.5" text-anchor="middle">Servo Open + LCD + MP3</text>

  <!-- CONNECTING ARROWS -->
  <!-- RC522 -> 4.1 -->
  <line x1="190" y1="127" x2="250" y2="127" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="220" y="120" font-size="8.5" fill="#0f172a" text-anchor="middle">UART</text>

  <!-- 4.1 -> 4.2 -->
  <line x1="345" y1="127" x2="470" y2="127" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="405" y="120" font-size="8.5" fill="#0f172a" text-anchor="middle">HTTP JSON</text>

  <!-- 4.2 -> D1 -->
  <line x1="565" y1="127" x2="700" y2="127" stroke="#0284c7" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="635" y="120" font-size="8.5" fill="#0284c7" text-anchor="middle">[If Entry Mode]</text>

  <!-- 4.3 -> D1 (Save S_entry) -->
  <line x1="795" y1="127" x2="875" y2="127" stroke="#0284c7" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="835" y="120" font-size="8.5" fill="#0284c7" text-anchor="middle">Save Entry</text>

  <!-- 4.2 -> 4.4 [If Exit Mode] -->
  <line x1="520" y1="172" x2="520" y2="270" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="530" y="225" font-size="8.5" font-weight="bold" fill="#0f172a">[If Exit Mode]</text>

  <!-- D2 -> 4.4 -->
  <line x1="745" y1="320" x2="570" y2="320" stroke="#0f766e" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="660" y="312" font-size="8.5" fill="#0f766e" text-anchor="middle">Lookup Stop Indices</text>

  <!-- 4.4 -> 4.5 -->
  <line x1="520" y1="365" x2="520" y2="460" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="530" y="415" font-size="8.5" font-weight="bold" fill="#0f172a">Stop Count N</text>

  <!-- 4.5 -> D3 -->
  <line x1="565" y1="510" x2="745" y2="510" stroke="#b45309" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="655" y="502" font-size="8.5" fill="#b45309" text-anchor="middle">Store Tx Log</text>

  <!-- 4.5 -> 4.6 -->
  <line x1="475" y1="510" x2="300" y2="510" stroke="#16a34a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="390" y="502" font-size="8.5" font-weight="bold" fill="#16a34a" text-anchor="middle">Gate &amp; Voice Pulse</text>

  <!-- 4.6 -> Hardware Output -->
  <line x1="205" y1="510" x2="185" y2="510" stroke="#16a34a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="195" y="502" font-size="8.5" fill="#16a34a" text-anchor="middle">PWM</text>
</svg>