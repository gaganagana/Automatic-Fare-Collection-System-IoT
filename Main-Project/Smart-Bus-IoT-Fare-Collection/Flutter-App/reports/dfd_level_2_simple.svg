<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="35" fill="#0f172a" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="0.5">DFD LEVEL 2: PROCESS 4.0 (FARE CALCULATION LOGIC)</text>
  <text x="450" y="58" fill="#64748b" font-size="12" text-anchor="middle">Algorithm for Distance-Based (₹10 / Stop) Automatic Wallet Debit</text>
  <line x1="50" y1="70" x2="850" y2="70" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- START: TAP EVENT -->
  <rect x="30" y="110" width="140" height="50" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <text x="100" y="132" fill="#0284c7" font-size="11.5" font-weight="bold" text-anchor="middle">CARD TAP</text>
  <text x="100" y="148" fill="#334155" font-size="10" text-anchor="middle">Exit Reader (UID)</text>

  <!-- SUB-PROCESSES -->
  <!-- 4.1: Fetch Entry Stop -->
  <circle cx="270" cy="135" r="45" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="270" y="128" font-size="11.5" font-weight="bold" fill="#0284c7" text-anchor="middle">4.1</text>
  <text x="270" y="143" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Fetch S_entry</text>
  <text x="270" y="155" font-size="9" fill="#475569" text-anchor="middle">From Card State</text>

  <!-- 4.2: Lookup Stop Indices -->
  <circle cx="470" cy="135" r="45" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="470" y="128" font-size="11.5" font-weight="bold" fill="#0284c7" text-anchor="middle">4.2</text>
  <text x="470" y="143" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Get Indices</text>
  <text x="470" y="155" font-size="9" fill="#475569" text-anchor="middle">(Entry &amp; Exit)</text>

  <!-- 4.3: Calculate Distance -->
  <circle cx="470" cy="290" r="45" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="470" y="283" font-size="11.5" font-weight="bold" fill="#0284c7" text-anchor="middle">4.3</text>
  <text x="470" y="298" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Distance N</text>
  <text x="470" y="310" font-size="9" fill="#475569" text-anchor="middle">|Exit - Entry|</text>

  <!-- 4.4: Multiply by Rate -->
  <circle cx="470" cy="450" r="45" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="470" y="443" font-size="11.5" font-weight="bold" fill="#0284c7" text-anchor="middle">4.4</text>
  <text x="470" y="458" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Fare Amount</text>
  <text x="470" y="470" font-size="9" fill="#15803d" font-weight="bold" text-anchor="middle">N × ₹10.00</text>

  <!-- 4.5: Update Balance -->
  <circle cx="680" cy="450" r="45" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="680" y="443" font-size="11.5" font-weight="bold" fill="#0284c7" text-anchor="middle">4.5</text>
  <text x="680" y="458" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Debit Wallet</text>
  <text x="680" y="470" font-size="9" fill="#475569" text-anchor="middle">Bal = Bal - Fare</text>

  <!-- DATA STORES -->
  <!-- D1: Wallet DB -->
  <g>
    <line x1="620" y1="110" x2="780" y2="110" stroke="#0284c7" stroke-width="2"/>
    <line x1="620" y1="160" x2="780" y2="160" stroke="#0284c7" stroke-width="2"/>
    <rect x="620" y="110" width="160" height="50" fill="#f0f9ff"/>
    <text x="635" y="135" fill="#0284c7" font-size="11.5" font-weight="bold">D1</text>
    <text x="660" y="135" fill="#0f172a" font-size="11" font-weight="bold">RFID Wallet DB</text>
    <text x="660" y="150" fill="#475569" font-size="9">Read Entry &amp; Balance</text>
  </g>

  <!-- D2: Stops DB -->
  <g>
    <line x1="200" y1="265" x2="350" y2="265" stroke="#0f766e" stroke-width="2"/>
    <line x1="200" y1="315" x2="350" y2="315" stroke="#0f766e" stroke-width="2"/>
    <rect x="200" y="265" width="150" height="50" fill="#f0fdfa"/>
    <text x="215" y="290" fill="#0f766e" font-size="11.5" font-weight="bold">D2</text>
    <text x="240" y="290" fill="#0f172a" font-size="11" font-weight="bold">18 Stops DB</text>
    <text x="240" y="305" fill="#475569" font-size="9">Stop Index Sequence</text>
  </g>

  <!-- D3: Transaction Logs DB -->
  <g>
    <line x1="620" y1="540" x2="780" y2="540" stroke="#b45309" stroke-width="2"/>
    <line x1="620" y1="590" x2="780" y2="590" stroke="#b45309" stroke-width="2"/>
    <rect x="620" y="540" width="160" height="50" fill="#fffbeb"/>
    <text x="635" y="565" fill="#b45309" font-size="11.5" font-weight="bold">D3</text>
    <text x="660" y="565" fill="#0f172a" font-size="11" font-weight="bold">Transaction DB</text>
    <text x="660" y="580" fill="#475569" font-size="9">Store Audit Log</text>
  </g>

  <!-- OUTPUT: GATE OPEN -->
  <rect x="30" y="425" width="140" height="50" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="447" fill="#16a34a" font-size="11.5" font-weight="bold" text-anchor="middle">GATE ACTUATION</text>
  <text x="100" y="463" fill="#15803d" font-size="10" text-anchor="middle">Servo 90° Open</text>

  <!-- CONNECTORS -->
  <!-- Tap -> 4.1 -->
  <line x1="170" y1="135" x2="220" y2="135" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="195" y="127" font-size="9" fill="#0f172a" text-anchor="middle">UID</text>

  <!-- 4.1 <-> D1 -->
  <line x1="315" y1="135" x2="420" y2="135" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="300" y1="110" x2="615" y2="125" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="370" y="127" font-size="9" fill="#0f172a" text-anchor="middle">S_entry</text>

  <!-- 4.2 <-> D2 -->
  <line x1="435" y1="165" x2="355" y2="265" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr2)"/>
  <text x="375" y="210" font-size="9" fill="#0f766e">Lookup</text>

  <!-- 4.2 -> 4.3 -->
  <line x1="470" y1="180" x2="470" y2="240" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="478" y="215" font-size="9" fill="#0f172a">Indices</text>

  <!-- 4.3 -> 4.4 -->
  <line x1="470" y1="335" x2="470" y2="400" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="478" y="370" font-size="9" font-weight="bold" fill="#0f172a">Count N</text>

  <!-- 4.4 -> 4.5 -->
  <line x1="515" y1="450" x2="630" y2="450" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="570" y="442" font-size="9.5" font-weight="bold" fill="#15803d" text-anchor="middle">Fare ₹</text>

  <!-- 4.5 -> D1 (Write Balance) -->
  <path d="M 720 420 C 760 350, 760 220, 720 165" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="770" y="290" font-size="9.5" font-weight="bold" fill="#0284c7">Write New Bal</text>

  <!-- 4.5 -> D3 (Write Tx) -->
  <line x1="680" y1="495" x2="680" y2="535" stroke="#b45309" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="690" y="520" font-size="9" fill="#b45309">Log Tx</text>

  <!-- 4.5 -> Gate Open -->
  <path d="M 640 475 C 500 550, 250 550, 150 480" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="350" y="555" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">Open Exit Door (PWM 90°)</text>
</svg>