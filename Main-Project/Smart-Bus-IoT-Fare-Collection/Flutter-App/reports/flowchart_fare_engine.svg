<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" width="900" height="860" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="35" fill="#0f172a" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="0.5">SUB-FLOWCHART: AUTOMATED FARE CALCULATION ENGINE</text>
  <text x="450" y="58" fill="#64748b" font-size="12" text-anchor="middle">Mathematical Algorithm for Stop-Based (₹10 / Stop) Automatic Fare Deduction</text>
  <line x1="60" y1="70" x2="840" y2="70" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- START -->
  <rect x="360" y="90" width="180" height="45" rx="22.5" fill="#0f172a"/>
  <text x="450" y="118" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">START (EXIT TAP)</text>

  <!-- 1. READ CARD UID & STATE -->
  <polygon points="320,165 580,165 550,215 290,215" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#shadow2)"/>
  <text x="435" y="185" fill="#0369a1" font-size="11.5" font-weight="bold" text-anchor="middle">Read Exit Card UID</text>
  <text x="435" y="202" fill="#475569" font-size="10" text-anchor="middle">Fetch stored S_entry and Balance</text>

  <!-- 2. GET STOP INDICES -->
  <rect x="310" y="250" width="280" height="60" rx="6" fill="#f8fafc" stroke="#0f766e" stroke-width="2" filter="url(#shadow2)"/>
  <text x="450" y="272" fill="#0f766e" font-size="11.5" font-weight="bold" text-anchor="middle">Lookup 18-Stop Route Sequence</text>
  <text x="450" y="292" fill="#334155" font-size="10.5" text-anchor="middle">Get index of EntryStop &amp; ExitStop</text>

  <!-- 3. COMPUTE STOPS N -->
  <rect x="310" y="345" width="280" height="60" rx="6" fill="#f8fafc" stroke="#0f766e" stroke-width="2" filter="url(#shadow2)"/>
  <text x="450" y="367" fill="#0f766e" font-size="11.5" font-weight="bold" text-anchor="middle">Compute Stops Travelled</text>
  <text x="450" y="387" fill="#334155" font-size="11" font-family="monospace" text-anchor="middle">N = max(1, |ExitIndex - EntryIndex|)</text>

  <!-- 4. CALCULATE FARE -->
  <rect x="310" y="440" width="280" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow2)"/>
  <text x="450" y="462" fill="#15803d" font-size="11.5" font-weight="bold" text-anchor="middle">Multiply by Standard Rate</text>
  <text x="450" y="482" fill="#15803d" font-size="11.5" font-weight="bold" font-family="monospace" text-anchor="middle">FareAmount = N × ₹10.00</text>

  <!-- 5. DEBIT WALLET & RESET STATE -->
  <rect x="310" y="535" width="280" height="65" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2" filter="url(#shadow2)"/>
  <text x="450" y="557" fill="#0284c7" font-size="11.5" font-weight="bold" text-anchor="middle">Update RFID Wallet State</text>
  <text x="450" y="575" fill="#334155" font-size="10.5" text-anchor="middle">• Balance = Balance - FareAmount</text>
  <text x="450" y="590" fill="#334155" font-size="10.5" text-anchor="middle">• Set onboard = false, recentExit = Stop</text>

  <!-- 6. ACTUATION & AUDIO FEEDBACK -->
  <rect x="310" y="635" width="280" height="65" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow2)"/>
  <text x="450" y="657" fill="#15803d" font-size="11.5" font-weight="bold" text-anchor="middle">Trigger Physical Actuation</text>
  <text x="450" y="675" fill="#334155" font-size="10" text-anchor="middle">• SG90 Servo Gate Opens 90° (3s duration)</text>
  <text x="450" y="688" fill="#334155" font-size="10" text-anchor="middle">• LCD: "Exit Stop, Fare ₹X, Bal ₹Y" • MP3 Audio</text>

  <!-- 7. END -->
  <rect x="360" y="740" width="180" height="45" rx="22.5" fill="#0f172a"/>
  <text x="450" y="768" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">END (EXIT COMPLETE)</text>

  <!-- CONNECTORS -->
  <line x1="450" y1="135" x2="450" y2="160" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="450" y1="215" x2="450" y2="245" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="450" y1="310" x2="450" y2="340" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="450" y1="405" x2="450" y2="435" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="450" y1="500" x2="450" y2="530" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="450" y1="600" x2="450" y2="630" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="450" y1="700" x2="450" y2="735" stroke="#0f172a" stroke-width="2" marker-end="url(#arr2)"/>
</svg>