<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1450" width="950" height="1450" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="475" y="40" fill="#0f172a" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="0.5">SMART BUS AUTOMATED SYSTEM FLOWCHART</text>
  <text x="475" y="65" fill="#64748b" font-size="13" text-anchor="middle">Complete End-to-End Operational Lifecycle: Hardware Sensing ➔ Fare Logic ➔ Actuation ➔ Cloud Sync</text>
  <line x1="80" y1="80" x2="870" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 1. START TERMINAL -->
  <rect x="385" y="100" width="180" height="48" rx="24" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
  <text x="475" y="130" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">START</text>

  <!-- 2. INITIALIZATION -->
  <rect x="335" y="180" width="280" height="75" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="202" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">System Initialization</text>
  <text x="475" y="222" fill="#334155" font-size="10.5" text-anchor="middle">• Initialize Arduino, RC522, Servo (0°)</text>
  <text x="475" y="238" fill="#334155" font-size="10.5" text-anchor="middle">• Connect NodeMCU Wi-Fi &amp; Flutter :8080</text>

  <!-- 3. INPUT / POLL CARD -->
  <!-- Parallelogram shape for I/O -->
  <polygon points="345,300 625,300 595,355 315,355" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="325" fill="#0369a1" font-size="12" font-weight="bold" text-anchor="middle">Poll MFRC522 RFID Reader</text>
  <text x="470" y="342" fill="#475569" font-size="10.5" text-anchor="middle">Wait for 13.56 MHz Card Tap</text>

  <!-- 4. DECISION: CARD DETECTED? -->
  <polygon points="475,390 605,445 475,500 345,445" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="440" fill="#92400e" font-size="11.5" font-weight="bold" text-anchor="middle">RFID Card</text>
  <text x="475" y="455" fill="#92400e" font-size="11.5" font-weight="bold" text-anchor="middle">Detected?</text>

  <!-- 5. DECISION: CARD REGISTERED & ACTIVE? -->
  <polygon points="475,540 615,595 475,650 335,595" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="588" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">Card Registered</text>
  <text x="475" y="605" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">&amp; Active?</text>

  <!-- REJECT: CARD INACTIVE / UNREGISTERED (LEFT) -->
  <rect x="80" y="565" width="180" height="60" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="588" fill="#dc2626" font-size="11" font-weight="bold" text-anchor="middle">Access Denied</text>
  <text x="170" y="605" fill="#475569" font-size="9.5" text-anchor="middle">LCD: "Card Inactive / Blocked"</text>
  <text x="170" y="618" fill="#475569" font-size="9.5" text-anchor="middle">Red LED ON • Door Locked (0°)</text>

  <!-- 6. DECISION: ONBOARD STATUS (ENTRY OR EXIT) -->
  <polygon points="475,690 605,745 475,800 345,745" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="738" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">Is Passenger</text>
  <text x="475" y="755" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">Onboard?</text>

  <!-- ==================== ENTRY BRANCH (LEFT) ==================== -->
  <!-- 7A. DECISION: MINIMUM BALANCE CHECK (>= ₹10) -->
  <polygon points="230,830 350,880 230,930 110,880" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="875" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">Balance &gt;= ₹10?</text>
  <text x="230" y="890" fill="#92400e" font-size="9.5" text-anchor="middle">(Min Base Fare)</text>

  <!-- LOW BALANCE REJECTION -->
  <rect x="30" y="970" width="160" height="60" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="992" fill="#dc2626" font-size="11" font-weight="bold" text-anchor="middle">Low Balance Alert</text>
  <text x="110" y="1008" fill="#475569" font-size="9.5" text-anchor="middle">LCD: "Low Bal! Recharge"</text>
  <text x="110" y="1022" fill="#475569" font-size="9.5" text-anchor="middle">Door Locked • Red LED</text>

  <!-- 8A. ENTRY SUCCESS: SET ONBOARD & OPEN GATE -->
  <rect x="230" y="970" width="190" height="75" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="325" y="992" fill="#15803d" font-size="11.5" font-weight="bold" text-anchor="middle">Boarding Permitted</text>
  <text x="325" y="1010" fill="#334155" font-size="10" text-anchor="middle">• Set onboard = true, S_entry</text>
  <text x="325" y="1025" fill="#334155" font-size="10" text-anchor="middle">• Open Servo Gate (90° for 3s)</text>
  <text x="325" y="1038" fill="#334155" font-size="10" text-anchor="middle">• LCD: "Welcome &lt;Name&gt;"</text>

  <!-- ==================== EXIT BRANCH (RIGHT) ==================== -->
  <!-- 7B. RETRIEVE STOPS & COMPUTE FARE -->
  <rect x="580" y="845" width="240" height="75" rx="6" fill="#f8fafc" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="868" fill="#0f766e" font-size="11.5" font-weight="bold" text-anchor="middle">Calculate Trip Fare</text>
  <text x="700" y="888" fill="#334155" font-size="10" text-anchor="middle">• Distance N = |S_exit - S_entry|</text>
  <text x="700" y="903" fill="#334155" font-size="10" text-anchor="middle">• Fare = N × ₹10.00</text>
  <text x="700" y="916" fill="#334155" font-size="10" text-anchor="middle">• Balance = Balance - Fare</text>

  <!-- 8B. EXIT ACTUATION & AUDIO VOICE -->
  <rect x="580" y="970" width="240" height="75" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="992" fill="#15803d" font-size="11.5" font-weight="bold" text-anchor="middle">Exit Permitted &amp; Announce</text>
  <text x="700" y="1010" fill="#334155" font-size="10" text-anchor="middle">• Set onboard = false</text>
  <text x="700" y="1025" fill="#334155" font-size="10" text-anchor="middle">• Open Servo Gate (90° for 3s)</text>
  <text x="700" y="1038" fill="#334155" font-size="10" text-anchor="middle">• LCD &amp; DFPlayer MP3 Voice</text>

  <!-- 9. CLOUD SYNC & LOGGING (MERGE NODE) -->
  <rect x="335" y="1110" width="280" height="65" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="1132" fill="#6d28d9" font-size="12" font-weight="bold" text-anchor="middle">Cloud &amp; Telemetry Sync</text>
  <text x="475" y="1150" fill="#334155" font-size="10" text-anchor="middle">• Transmit HTTP JSON to Port 8080</text>
  <text x="475" y="1165" fill="#334155" font-size="10" text-anchor="middle">• Log Transaction to Firebase Firestore</text>

  <!-- 10. CLOSE GATE & UPDATE NEXT STOP -->
  <rect x="335" y="1220" width="280" height="60" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="1242" fill="#0284c7" font-size="11.5" font-weight="bold" text-anchor="middle">Reset Gate &amp; Update Route</text>
  <text x="475" y="1260" fill="#334155" font-size="10" text-anchor="middle">• SG90 Servo returns to 0° (Closed)</text>
  <text x="475" y="1273" fill="#334155" font-size="10" text-anchor="middle">• Update LCD Station &amp; Live Map Progress</text>

  <!-- 11. REPEAT LOOP BACK -->
  <line x1="475" y1="1280" x2="475" y2="1330" stroke="#0f172a" stroke-width="2"/>
  <line x1="475" y1="1330" x2="890" y2="1330" stroke="#0f172a" stroke-width="2"/>
  <line x1="890" y1="1330" x2="890" y2="328" stroke="#0f172a" stroke-width="2"/>
  <line x1="890" y1="328" x2="635" y2="328" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="1320" font-size="11" font-weight="bold" fill="#0f172a">Continuous Monitoring Loop</text>

  <!-- FLOW CONNECTORS -->
  <!-- Start -> Init -->
  <line x1="475" y1="148" x2="475" y2="175" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Init -> Poll -->
  <line x1="475" y1="255" x2="475" y2="295" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Poll -> Card Detected? -->
  <line x1="475" y1="355" x2="475" y2="385" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card Detected? -> No (Loop back) -->
  <line x1="345" y1="445" x2="290" y2="445" stroke="#0f172a" stroke-width="2"/>
  <line x1="290" y1="445" x2="290" y2="328" stroke="#0f172a" stroke-width="2"/>
  <line x1="290" y1="328" x2="310" y2="328" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="438" font-size="10" font-weight="bold" fill="#dc2626">No</text>

  <!-- Card Detected? -> Yes -->
  <line x1="475" y1="500" x2="475" y2="535" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="520" font-size="10" font-weight="bold" fill="#16a34a">Yes</text>

  <!-- Card Active? -> No -->
  <line x1="335" y1="595" x2="265" y2="595" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="295" y="588" font-size="10" font-weight="bold" fill="#dc2626">No</text>

  <!-- Reject -> Loop back -->
  <line x1="170" y1="565" x2="170" y2="328" stroke="#0f172a" stroke-width="2"/>
  <line x1="170" y1="328" x2="310" y2="328" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card Active? -> Yes -->
  <line x1="475" y1="650" x2="475" y2="685" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="670" font-size="10" font-weight="bold" fill="#16a34a">Yes</text>

  <!-- Onboard? -> No (Entry Mode) -->
  <line x1="345" y1="745" x2="230" y2="745" stroke="#0f172a" stroke-width="2"/>
  <line x1="230" y1="745" x2="230" y2="825" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="738" font-size="10" font-weight="bold" fill="#0284c7">No (Entry Tap)</text>

  <!-- Onboard? -> Yes (Exit Mode) -->
  <line x1="605" y1="745" x2="700" y2="745" stroke="#0f172a" stroke-width="2"/>
  <line x1="700" y1="745" x2="700" y2="840" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="625" y="738" font-size="10" font-weight="bold" fill="#0f766e">Yes (Exit Tap)</text>

  <!-- Balance >= ₹10? -> No -->
  <line x1="110" y1="880" x2="70" y2="880" stroke="#0f172a" stroke-width="2"/>
  <line x1="70" y1="880" x2="70" y2="965" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="80" y="872" font-size="9.5" font-weight="bold" fill="#dc2626">No</text>

  <!-- Low Bal -> Loop back -->
  <line x1="30" y1="1000" x2="10" y2="1000" stroke="#0f172a" stroke-width="2"/>
  <line x1="10" y1="1000" x2="10" y2="328" stroke="#0f172a" stroke-width="2"/>
  <line x1="10" y1="328" x2="310" y2="328" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Balance >= ₹10? -> Yes -->
  <line x1="230" y1="930" x2="230" y2="965" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="948" font-size="10" font-weight="bold" fill="#16a34a">Yes</text>

  <!-- Entry Success -> Merge Sync -->
  <line x1="325" y1="1045" x2="325" y2="1075" stroke="#0f172a" stroke-width="2"/>
  <line x1="325" y1="1075" x2="410" y2="1075" stroke="#0f172a" stroke-width="2"/>
  <line x1="410" y1="1075" x2="410" y2="1105" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7B -> 8B -->
  <line x1="700" y1="920" x2="700" y2="965" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Exit Success -> Merge Sync -->
  <line x1="700" y1="1045" x2="700" y2="1075" stroke="#0f172a" stroke-width="2"/>
  <line x1="700" y1="1075" x2="540" y2="1075" stroke="#0f172a" stroke-width="2"/>
  <line x1="540" y1="1075" x2="540" y2="1105" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sync -> Reset Gate -->
  <line x1="475" y1="1175" x2="475" y2="1215" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
</svg>